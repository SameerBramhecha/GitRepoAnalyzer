name: Repo analysis

on:
  # Run every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

  # Or trigger it manually from the Actions tab
  workflow_dispatch:
    inputs:
      instructions:
        description: Which instruction set to use
        required: false
        default: default
        type: choice
        options:
          - default
          - security

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the report back into the repo

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install RepoAnalyzer
        run: dotnet tool install --global repo-analyzer

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add COPILOT_TOKEN if you have a separate Copilot service token
        run: |
          repo-analyzer ${{ github.server_url }}/${{ github.repository }} \
            --instructions instructions/${{ inputs.instructions || 'default' }}.json \
            --output reports \
            --token "$GITHUB_TOKEN"
