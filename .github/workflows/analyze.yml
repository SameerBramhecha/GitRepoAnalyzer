name: Repo analysis

on:
  # Run every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

  # Or trigger it manually from the Actions tab
  workflow_dispatch:
    inputs:
      repo:
        description: 'Full repo URL or owner/repo to analyze (defaults to this repo)'
        required: false
        type: string
        default: ''
      instructions:
        description: Which instruction set to use
        required: false
        default: default
        type: choice
        options:
          - default
          - security

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the report back into the repo

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish RepoAnalyzer
        run: |
          dotnet publish -c Release -o out

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add COPILOT_TOKEN if you have a separate Copilot service token
        run: |
          # Allow overriding the target repo via the `repo` input; fall back to the current repo
          repo="${{ inputs.repo }}"
          if [ -z "$repo" ]; then
            repo="${{ github.server_url }}/${{ github.repository }}"
          fi

          # Prefer a PAT stored in `TARGET_REPO_TOKEN` for pushing into other repos.
          token="${{ secrets.TARGET_REPO_TOKEN }}"
          if [ -z "$token" ]; then
            token="$GITHUB_TOKEN"
          fi

          # Run the published analyzer from this repository
          dotnet out/repo-analyzer.dll "$repo" \
            --instructions "${{ inputs.instructions || 'default' }}.json" \
            --output reports \
            --token "$token"
