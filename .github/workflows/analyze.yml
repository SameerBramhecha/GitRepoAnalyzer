name: Repo analysis

on:
  # Run every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

  # Or trigger it manually from the Actions tab
  workflow_dispatch:
    inputs:
      repo:
        description: 'Full repo URL or owner/repo to analyze (defaults to this repo)'
        required: false
        type: string
        default: ''
      instructions:
        description: Which instruction set to use
        required: false
        default: default
        type: choice
        options:
          - default
          - security

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish RepoAnalyzer
        run: |
          dotnet publish -c Release -o out

      - name: Run analysis
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Allow overriding the target repo via the `repo` input; fall back to the current repo
          repo="${{ inputs.repo }}"
          if [ -z "$repo" ]; then
            repo="${{ github.server_url }}/${{ github.repository }}"
          fi

          # Run the published analyzer from this repository (--dry-run to skip git operations)
          dotnet out/repo-analyzer.dll "$repo" \
            --instructions "${{ inputs.instructions || 'default' }}.json" \
            --output reports \
            --copilot-token "$COPILOT_GITHUB_TOKEN" \
            --dry-run

      - name: Upload analysis report
        if: always() && hashFiles('reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: reports/
          retention-days: 30
