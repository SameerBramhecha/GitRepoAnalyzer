name: Repo analysis

on:
  # Run every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

  # Trigger manually from the Actions tab
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo to analyze — full URL or owner/repo (blank = this repo)'
        required: false
        type: string
        default: ''
      instructions:
        description: 'Instruction set to use'
        required: false
        default: default
        type: choice
        options:
          - default
          - security

permissions:
  contents: read   # checkout only — no push needed
  actions: write   # required to upload artifacts

env:
  DOTNET_VERSION: '8.0.x'   # must match <TargetFramework> in .csproj

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout FIRST so hashFiles works correctly ────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. .NET setup + NuGet cache ───────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── 3. Build ──────────────────────────────────────────────────────────
      - name: Publish RepoAnalyzer
        run: dotnet publish -c Release -o out

      # ── 4. Resolve target repo ────────────────────────────────────────────
      - name: Resolve target repo URL
        id: target
        run: |
          repo="${{ inputs.repo }}"
          if [ -z "$repo" ]; then
            repo="${{ github.server_url }}/${{ github.repository }}"
          elif [[ "$repo" != http* ]]; then
            # Accept shorthand  owner/repo  and expand it
            repo="${{ github.server_url }}/$repo"
          fi
          echo "url=$repo" >> "$GITHUB_OUTPUT"

      # ── 5. Run analysis (dry-run: writes reports locally, no git push) ────
      - name: Run analysis
        env:
          # Falls back to the built-in GITHUB_TOKEN when TARGET_REPO_TOKEN is absent
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set=${{ inputs.instructions || 'default' }}

          dotnet out/repo-analyzer.dll "${{ steps.target.outputs.url }}" \
            --instructions "${set}.json" \
            --output reports \
            --token "$GH_TOKEN" \
            --dry-run

      # ── 6. Emit a job summary ─────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          set=${{ inputs.instructions || 'default' }}
          report="reports/$(jq -r .reportFileName instructions/${set}.json 2>/dev/null || echo 'analysis-report.md')"

          echo "## 📊 Analysis report — \`${set}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target** | ${{ steps.target.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$report" ]; then
            echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # Skip the 8-line metadata header, show the next 40 lines
            tail -n +9 "$report" | head -40 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Report file not found — check the Run analysis step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 7. Upload reports as artifacts ────────────────────────────────────
      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-${{ inputs.instructions || 'default' }}-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn